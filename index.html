<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="河北省第三次全国土壤普查成果编制质量控制意见交流平台">
  <title>河北省第三次全国土壤普查成果编制——质量控制意见交流平台</title>
  <link rel="icon" href="./assets/soil-survey-logo.png" type="image/png">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/mobile.css">
  <link rel="stylesheet" href="./src/styles/print.css" media="print">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <img class="header-logo" src="./assets/soil-survey-logo.png" alt="第三次全国土壤普查">
        <h1>河北省第三次全国土壤普查成果编制——质量控制意见交流平台</h1>
        <div class="header-tools"><button id="adminCredentialButton" class="ghost-button" type="button">管理员凭证</button></div>
      </div>
      <nav id="resultTabs" class="tabs" role="tablist" aria-label="成果类型">
        <button id="tab-soilType" class="active" role="tab" type="button" aria-selected="true" aria-controls="resultsPanel" data-type="soilType">土壤类型图</button>
        <button id="tab-soilAttr" role="tab" type="button" aria-selected="false" aria-controls="resultsPanel" tabindex="-1" data-type="soilAttr">土壤属性图</button>
        <button id="tab-farmland" role="tab" type="button" aria-selected="false" aria-controls="resultsPanel" tabindex="-1" data-type="farmland">耕地质量评价</button>
        <button id="tab-references" role="tab" type="button" aria-selected="false" aria-controls="referencePanel" tabindex="-1" data-type="references">参考文件</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="resultsPanel" role="tabpanel" aria-labelledby="tab-soilType">
      <form id="filterForm" class="toolbar" aria-label="全局检索与组合筛选">
        <input type="search" name="query" aria-label="全局检索" placeholder="检索成果、市、单位、任务单元或联系人">
        <select name="city" aria-label="城市"></select>
        <select name="unit" aria-label="作业单位"></select>
        <select name="district" aria-label="任务单元"></select>
        <select name="batch" aria-label="批次"></select>
        <select name="missing" aria-label="收缴状态"><option value="">全部收缴状态</option><option value="submitted">已收</option><option value="missing">缺失</option></select>
        <select name="answered" aria-label="答复状态"><option value="">全部答复状态</option><option value="answered">已答复</option><option value="unanswered">未答复</option></select>
        <div class="toolbar-actions">
          <button type="button" class="secondary-button" data-action="reset-filters">重置</button>
          <button type="button" class="secondary-button" data-export="csv">导出 CSV</button>
          <button type="button" class="primary-button" data-export="xlsx">导出 XLSX</button>
        </div>
      </form>
      <div class="scope-row">
        <div id="scopeSelector" class="scope-selector" aria-label="统计范围">
          <button type="button" class="active" aria-pressed="true" data-scope="province">全省</button>
          <button type="button" aria-pressed="false" data-scope="north">北片区</button>
          <button type="button" aria-pressed="false" data-scope="south">南片区</button>
        </div>
        <div id="dataStatus" class="data-status" role="status">正在校验数据……</div>
      </div>
      <section id="summaryCards" class="summary-cards" aria-label="统计摘要"></section>
      <section id="missingBanner" class="missing-banner" aria-live="polite"></section>
      <div id="resultsRoot" aria-live="polite"><div class="empty-state">正在加载……</div></div>
    </section>

    <section id="referencePanel" role="tabpanel" aria-labelledby="tab-references" hidden>
      <div id="referenceLibraryRoot"><div class="empty-state">正在加载参考文件目录……</div></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand survey"><img src="./assets/soil-survey-logo.png" alt="第三次全国土壤普查"><span>第三次全国土壤普查</span></div>
      <div class="footer-brand cau"><img src="./assets/logo.jpg" alt="中国农业大学"></div>
      <span id="versionLabel" class="version">v1.5.0</span>
    </div>
  </footer>

  <div id="uploadModal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="uploadTitle" aria-describedby="uploadContext">
    <div class="modal-card">
      <h2 id="uploadTitle">整改答复管理</h2>
      <p id="uploadContext"></p>
      <label class="field-label" for="replyFile">选择整改答复文件</label>
      <input id="replyFile" type="file" accept=".pdf,.doc,.docx,.xlsx,.xls,.zip,.rar">
      <progress id="uploadProgress" value="0" max="100" aria-label="上传进度"></progress>
      <div id="deletePreview" class="delete-preview" aria-live="polite"></div>
      <div class="modal-actions">
        <button type="button" class="secondary-button" data-close-modal>取消</button>
        <button type="button" id="confirmDelete" class="danger-button" hidden>确认删除</button>
        <button type="button" id="confirmUpload" class="primary-button">确认上传</button>
      </div>
    </div>
  </div>

  <div id="credentialModal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="credentialTitle" aria-describedby="credentialDescription">
    <div class="modal-card">
      <h2 id="credentialTitle">管理员凭证</h2>
      <p id="credentialDescription">可临时覆盖项目内置凭证，仅保存在当前浏览器会话。</p>
      <label class="field-label" for="adminToken">GitHub Token</label>
      <input id="adminToken" type="password" autocomplete="off" placeholder="GitHub Token">
      <div class="modal-actions">
        <button type="button" id="clearCredential" class="secondary-button">清除</button>
        <button type="button" class="secondary-button" data-close-modal>取消</button>
        <button type="button" id="saveCredential" class="primary-button">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./upload-config.js"></script>
  <script src="./vendor/write-excel-file.min.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
