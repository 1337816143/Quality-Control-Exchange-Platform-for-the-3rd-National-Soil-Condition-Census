name: Migrate v1.5.0

on:
  push:
    branches: [agent/v1.5.0-platform-upgrade]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'chore: generate v1.5.0 structure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate v1.5.0 structure
        run: node scripts/migrate-v1.5.0.mjs

      - name: Generate transparent PNG logo
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-logo.py

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install validation dependencies
        run: npm ci

      - name: Validate generated repository
        run: npm run validate

      - name: Commit generated structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generate v1.5.0 structure"
          git push origin HEAD:agent/v1.5.0-platform-upgrade
