name: Pages public check

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    paths: [pages-public-check.trigger]

permissions:
  contents: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed v1.5.0 page
        shell: bash
        env:
          PAGE_URL: https://1337816143.github.io/Quality-Control-Exchange-Platform-for-the-3rd-National-Soil-Condition-Census/
        run: |
          set -euo pipefail
          status=000
          for attempt in $(seq 1 36); do
            status=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' --max-time 20 "$PAGE_URL" || true)
            title=$(python - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/site.html').read_text(encoding='utf-8', errors='ignore') if Path('/tmp/site.html').exists() else ''
          match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
          print(re.sub(r'\s+', ' ', match.group(1)).strip() if match else '')
          PY
            )
            echo "attempt=$attempt http=$status title=$title"
            if [ "$status" = '200' ] && grep -q 'v1.5.0' /tmp/site.html && grep -q '河北省第三次全国土壤普查成果编制' /tmp/site.html; then
              echo "PUBLIC_PAGE_URL=$PAGE_URL"
              echo "PUBLIC_HTTP_STATUS=$status"
              echo "PUBLIC_PAGE_TITLE=$title"
              exit 0
            fi
            sleep 5
          done
          echo "Public Pages verification failed: HTTP $status" >&2
          sed -n '1,40p' /tmp/site.html >&2 || true
          exit 1
