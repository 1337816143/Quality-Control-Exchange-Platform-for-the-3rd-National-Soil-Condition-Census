name: Pages public check

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    paths: [pages-public-check.trigger]

permissions:
  contents: read
  actions: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect latest deployment workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '=== Latest deploy.yml runs ==='
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=admin-import-and-reference-files&per_page=10" \
            | jq -r '.workflow_runs[] | [.id,.event,.status,(.conclusion // "null"),.head_sha,.run_started_at,.html_url] | @tsv'
          echo '=== Pages API response ==='
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true
      - name: Inspect current public page
        shell: bash
        env:
          PAGE_URL: https://1337816143.github.io/Quality-Control-Exchange-Platform-for-the-3rd-National-Soil-Condition-Census/
        run: |
          set -euo pipefail
          status=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' --max-time 25 "$PAGE_URL" || true)
          title=$(python - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/site.html').read_text(encoding='utf-8', errors='ignore') if Path('/tmp/site.html').exists() else ''
          match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
          print(re.sub(r'\s+', ' ', match.group(1)).strip() if match else '')
          PY
          )
          echo "PUBLIC_PAGE_URL=$PAGE_URL"
          echo "PUBLIC_HTTP_STATUS=$status"
          echo "PUBLIC_PAGE_TITLE=$title"
          if grep -q 'v1.5.0' /tmp/site.html; then echo 'PUBLIC_VERSION=v1.5.0'; else echo 'PUBLIC_VERSION=legacy'; fi
          test "$status" = '200'
          grep -q 'v1.5.0' /tmp/site.html
          grep -q '河北省第三次全国土壤普查成果编制' /tmp/site.html
