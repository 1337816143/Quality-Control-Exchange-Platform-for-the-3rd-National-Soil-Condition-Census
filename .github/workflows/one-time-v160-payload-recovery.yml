name: One-time v1.6.0 payload recovery

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    types: [synchronize]
    paths: [v160-recovery.trigger]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.0-legacy-parity
          fetch-depth: 1
      - name: Recover valid XZ stream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v160-blobs
          cat > /tmp/v160-shas.txt <<'EOF'
          ae9511a3570775239322aab3be4987ca6297a3aa
          403d75eb51babd752718ce930b34cb6caddb791d
          c5abee02e8cd91411d3e99f8ae57ac2fec956434
          49ebf0c21f3015949c1c189f0bb3e9c00a43935c
          3abd1037cc7498c3dd5cb1b6f6c602af4d025cab
          98851b08daf6bc747dab319bf155355f9dda7e8b
          bea03407e60637c33d894ddc0025d6ec3d4904c8
          7080a05cb02b35992adfc0ba474b71dd6c1370a5
          2b12ede8c78148669c850fd98bfec96630d5cc67
          EOF
          while read -r sha; do
            curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 --decode > "/tmp/v160-blobs/$sha"
          done < /tmp/v160-shas.txt
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          shas=[x.strip() for x in Path('/tmp/v160-shas.txt').read_text().splitlines() if x.strip()]
          parts=[(Path('/tmp/v160-blobs')/x).read_bytes() for x in shas]
          alphabet=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          successes=[]
          for boundary in range(len(parts)-1):
              prefix=b''.join(parts[:boundary+1]); suffix=b''.join(parts[boundary+1:])
              for char in alphabet:
                  try:
                      compressed=base64.b64decode(prefix+bytes([char])+suffix, validate=True)
                      payload=lzma.decompress(compressed)
                  except Exception:
                      continue
                  item={'boundary':boundary+1,'character':chr(char),'compressedBytes':len(compressed),'payloadBytes':len(payload),'payloadSha256':hashlib.sha256(payload).hexdigest(),'magicHex':payload[:32].hex(),'magicText':repr(payload[:80])}
                  successes.append(item)
                  Path(f'/tmp/recovered-{boundary+1}-{chr(char)}.bin').write_bytes(payload)
          print('XZ_SUCCESSES='+json.dumps(successes,ensure_ascii=False))
          if not successes:
              raise SystemExit('No valid boundary recovery; missing character is internal to a segment')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1.6.0-xz-recovery-candidates
          path: /tmp/recovered-*.bin
          if-no-files-found: error
          retention-days: 2
