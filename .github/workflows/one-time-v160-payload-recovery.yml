name: One-time v1.6.0 payload recovery

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    types: [synchronize]
    paths: [v160-recovery.trigger]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.0-legacy-parity
          fetch-depth: 1
      - name: Inspect and reconstruct staged Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 99ece19f01740d8662fe762593cd0141dd4ae3f45c82705d2c30de11a37de91c
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v160-blobs
          cat > /tmp/v160-shas.txt <<'EOF'
          ae9511a3570775239322aab3be4987ca6297a3aa
          403d75eb51babd752718ce930b34cb6caddb791d
          c5abee02e8cd91411d3e99f8ae57ac2fec956434
          49ebf0c21f3015949c1c189f0bb3e9c00a43935c
          3abd1037cc7498c3dd5cb1b6f6c602af4d025cab
          98851b08daf6bc747dab319bf155355f9dda7e8b
          bea03407e60637c33d894ddc0025d6ec3d4904c8
          7080a05cb02b35992adfc0ba474b71dd6c1370a5
          2b12ede8c78148669c850fd98bfec96630d5cc67
          93ad2329e6ad07297d43e523cb0cce040e68b630
          b97fa3b959d44a4f8418f71a06fad1765af384df
          68499f783e1456c5b37bd736107c3685a388dc4f
          ce5c6e0aaed219955c5322e13814dd9f847a6165
          b3a425249b207819e63bf9a2716fd16f63b0f7b7
          75e69bb7624c5bfc397bbae8ec3bd42eb10cff13
          5805ea041a1de4db764f7cbb8e3dcca34647501b
          EOF
          while read -r sha; do
            curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 --decode > "/tmp/v160-blobs/$sha"
          done < /tmp/v160-shas.txt
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, itertools, json, os, zipfile, io

          expected = os.environ['EXPECTED_SHA256']
          root = Path('/tmp/v160-blobs')
          order = [line.strip() for line in Path('/tmp/v160-shas.txt').read_text().splitlines() if line.strip()]
          pieces = {sha: (root / sha).read_bytes() for sha in order}
          print('=== BLOB INVENTORY ===')
          for i, sha in enumerate(order, 1):
              data = pieces[sha]
              print(f'{i:02d} {sha} bytes={len(data)} first={data[:20]!r} last={data[-20:]!r}')

          branch_files = []
          for path in sorted(Path('.v160').glob('payload.part*')) if Path('.v160').exists() else []:
              data = path.read_bytes()
              key = 'branch:' + path.name
              pieces[key] = data
              branch_files.append(key)
              print(f'BR {key} bytes={len(data)} first={data[:20]!r} last={data[-20:]!r}')

          def test(name, keys):
              text = b''.join(pieces[key] for key in keys)
              result = {'name': name, 'keys': keys, 'textBytes': len(text)}
              try:
                  raw = base64.b64decode(text, validate=True)
                  result['decodedBytes'] = len(raw)
                  result['sha256'] = hashlib.sha256(raw).hexdigest()
                  result['zip'] = zipfile.is_zipfile(io.BytesIO(raw))
                  if result['zip']:
                      with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                          result['entries'] = len(archive.infolist())
                          result['badEntry'] = archive.testzip()
              except Exception as exc:
                  result['error'] = str(exc)
              print(json.dumps(result, ensure_ascii=False))
              return result.get('sha256') == expected and result.get('zip') and result.get('badEntry') is None

          candidates = [
              ('first-10', order[:10]),
              ('first-9-plus-11', order[:9] + [order[10]]),
              ('first-9-plus-12', order[:9] + [order[11]]),
              ('first-9-plus-13', order[:9] + [order[12]]),
              ('first-6-plus-7-10', order[:10]),
              ('all-created-order', order),
              ('first-7-plus-branch', order[:7] + branch_files),
              ('first-8-plus-branch', order[:8] + branch_files),
              ('first-9-plus-branch', order[:9] + branch_files),
          ]
          matched = None
          for name, keys in candidates:
              if test(name, keys):
                  matched = (name, keys)
                  break
          if matched:
              Path('/tmp/v160-recovery.json').write_text(json.dumps({'matched': matched[0], 'keys': matched[1]}, indent=2), encoding='utf-8')
              print('RECOVERY_MATCH=' + matched[0])
          else:
              print('RECOVERY_MATCH=none')
          PY
