name: One-time v1.6.0 payload recovery

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    types: [synchronize]
    paths: [v160-recovery.trigger]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.0-legacy-parity
          fetch-depth: 1
      - name: Locate first XZ decoding error
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v160-blobs
          cat > /tmp/v160-shas.txt <<'EOF'
          ae9511a3570775239322aab3be4987ca6297a3aa
          403d75eb51babd752718ce930b34cb6caddb791d
          c5abee02e8cd91411d3e99f8ae57ac2fec956434
          49ebf0c21f3015949c1c189f0bb3e9c00a43935c
          3abd1037cc7498c3dd5cb1b6f6c602af4d025cab
          98851b08daf6bc747dab319bf155355f9dda7e8b
          bea03407e60637c33d894ddc0025d6ec3d4904c8
          7080a05cb02b35992adfc0ba474b71dd6c1370a5
          2b12ede8c78148669c850fd98bfec96630d5cc67
          EOF
          while read -r sha; do
            curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 --decode > "/tmp/v160-blobs/$sha"
          done < /tmp/v160-shas.txt
          python - <<'PY'
          from pathlib import Path
          import base64, json, lzma
          shas=[x.strip() for x in Path('/tmp/v160-shas.txt').read_text().splitlines() if x.strip()]
          parts=[(Path('/tmp/v160-blobs')/x).read_bytes() for x in shas]
          encoded=b''.join(parts)
          padded=encoded+b'='*((-len(encoded))%4)
          damaged=base64.b64decode(padded,validate=True)
          decoder=lzma.LZMADecompressor()
          produced=0
          error_at=None
          error_text=''
          for index,value in enumerate(damaged):
              try:
                  produced+=len(decoder.decompress(bytes([value])))
              except lzma.LZMAError as exc:
                  error_at=index
                  error_text=str(exc)
                  break
          if error_at is None:
              error_at=len(damaged)
          global_b64=(error_at*4)//3
          prefix_before_part7=sum(len(x) for x in parts[:6])
          estimate=global_b64-prefix_before_part7
          result={'encodedBytes':len(encoded),'decodedDamagedBytes':len(damaged),'xzErrorByte':error_at,'producedBytesBeforeError':produced,'globalBase64Estimate':global_b64,'part7PrefixBytes':prefix_before_part7,'part7PositionEstimate':estimate,'error':error_text}
          print('XZ_OFFSET='+json.dumps(result,ensure_ascii=False))
          Path('/tmp/v160-offset.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v1.6.0-xz-offset
          path: /tmp/v160-offset.json
          if-no-files-found: error
          retention-days: 2
