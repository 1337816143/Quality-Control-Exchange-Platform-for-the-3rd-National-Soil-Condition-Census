name: One-time v1.6.0 payload recovery

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    types: [synchronize]
    paths: [v160-recovery.trigger]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.0-legacy-parity
          fetch-depth: 1
      - name: Export all staged payload objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v160-candidates/blobs /tmp/v160-candidates/branch
          cat > /tmp/v160-shas.txt <<'EOF'
          ae9511a3570775239322aab3be4987ca6297a3aa
          403d75eb51babd752718ce930b34cb6caddb791d
          c5abee02e8cd91411d3e99f8ae57ac2fec956434
          49ebf0c21f3015949c1c189f0bb3e9c00a43935c
          3abd1037cc7498c3dd5cb1b6f6c602af4d025cab
          98851b08daf6bc747dab319bf155355f9dda7e8b
          bea03407e60637c33d894ddc0025d6ec3d4904c8
          7080a05cb02b35992adfc0ba474b71dd6c1370a5
          2b12ede8c78148669c850fd98bfec96630d5cc67
          93ad2329e6ad07297d43e523cb0cce040e68b630
          b97fa3b959d44a4f8418f71a06fad1765af384df
          68499f783e1456c5b37bd736107c3685a388dc4f
          ce5c6e0aaed219955c5322e13814dd9f847a6165
          EOF
          while read -r sha; do
            curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 --decode > "/tmp/v160-candidates/blobs/$sha"
          done < /tmp/v160-shas.txt
          cp -a .v160/payload.part* /tmp/v160-candidates/branch/ 2>/dev/null || true
          cp /tmp/v160-shas.txt /tmp/v160-candidates/order.txt
          find /tmp/v160-candidates -type f -printf '%P\t%s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: v1.6.0-staged-object-candidates
          path: /tmp/v160-candidates
          if-no-files-found: error
          retention-days: 2
