name: Publish GitHub Pages

on:
  push:
    branches: [admin-import-and-reference-files]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm run build
      - name: Publish dist to the configured Pages source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          rm -rf /tmp/pages
          git worktree add -B pages-publish /tmp/pages origin/main
          find /tmp/pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. /tmp/pages/
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git add -A
          if git diff --cached --quiet; then
            echo 'Pages output is already current.'
            exit 0
          fi
          git commit -m "deploy: publish v1.5.0 GitHub Pages"
          git push origin pages-publish:main
