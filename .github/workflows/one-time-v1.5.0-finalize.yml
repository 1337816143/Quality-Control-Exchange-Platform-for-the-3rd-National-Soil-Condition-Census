name: One-time v1.5.0 finalization

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    types: [synchronize]
    paths: [trigger-validation.txt]

permissions:
  contents: read

concurrency:
  group: one-time-v1.5.0-finalization
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1.5.0-platform-upgrade
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and validate v1.5.0
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/bootstrap-logo.py
          node scripts/migrate-v1.5.0.mjs
          python scripts/post-migrate-v1.5.0.py
          python scripts/fix-generated-tests-v1.5.0.py
          python scripts/fix-xlsx-v1.5.0.py
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check upload-config.js
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=high
          npm run validate
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=desktop
          npm run test:e2e -- --project=tablet
          npm run test:e2e -- --project=mobile
          cat > release-deletions.txt <<'EOF'
          assets/soil-survey-logo.svg
          page-enhancements.js
          page-enhancements-core.js
          reference-library.js
          migration-failure.log
          migration-diagnostics.log
          trigger-validation.txt
          scripts/migrate-v1.5.0.mjs
          scripts/bootstrap-logo.py
          scripts/generate-logo.py
          scripts/post-migrate-v1.5.0.py
          scripts/fix-generated-tests-v1.5.0.py
          scripts/fix-xlsx-v1.5.0.py
          .github/workflows/migrate-v1.5.0.yml
          EOF

      - name: Upload validated release files
        uses: actions/upload-artifact@v4
        with:
          name: v1.5.0-release-files
          if-no-files-found: error
          retention-days: 1
          path: |
            index.html
            upload-config.js
            CHANGELOG.md
            package.json
            package-lock.json
            playwright.config.js
            assets/soil-survey-logo.png
            data/organizations.json
            data/results.json
            data/validation-report.json
            src
            scripts/build.mjs
            scripts/check-logo.mjs
            scripts/validate-data.mjs
            tests
            .github/workflows/ci.yml
            .github/workflows/deploy.yml
            release-deletions.txt
