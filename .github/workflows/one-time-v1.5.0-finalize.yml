name: One-time v1.5.0 finalization

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    types: [synchronize]
    paths: [trigger-validation.txt]

permissions:
  contents: write

concurrency:
  group: one-time-v1.5.0-finalization
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1.5.0-platform-upgrade
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate, harden and validate v1.5.0
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/bootstrap-logo.py
          node scripts/migrate-v1.5.0.mjs
          python scripts/post-migrate-v1.5.0.py
          python scripts/fix-generated-tests-v1.5.0.py
          python scripts/fix-xlsx-v1.5.0.py
          python scripts/post-final-hardening-v1.5.0.py
          python scripts/restore-admin-github-v1.5.0.py
          python scripts/restore-admin-index-v1.5.0.py
          python scripts/restore-results-v1.5.0.py
          find src scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check upload-config.js
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=high
          npm run validate
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=desktop
          npm run test:e2e -- --project=tablet
          npm run test:e2e -- --project=mobile

      - name: Commit validated non-workflow release files
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/soil-survey-logo.svg page-enhancements.js page-enhancements-core.js reference-library.js
          rm -f migration-failure.log migration-diagnostics.log release-deletions.txt
          rm -f scripts/migrate-v1.5.0.mjs scripts/bootstrap-logo.py scripts/generate-logo.py
          rm -f scripts/post-migrate-v1.5.0.py scripts/fix-generated-tests-v1.5.0.py scripts/fix-xlsx-v1.5.0.py
          rm -f scripts/post-final-hardening-v1.5.0.py scripts/fix-final-syntax-v1.5.0.py
          rm -f scripts/restore-admin-github-v1.5.0.py scripts/restore-admin-index-v1.5.0.py scripts/restore-results-v1.5.0.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**' ':(exclude)trigger-validation.txt'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No release changes were generated.' >&2
            exit 1
          fi
          git commit -m "feat: release hardened v1.5.0 platform"
          git push origin HEAD:refs/heads/agent/v1.5.0-platform-upgrade

      - name: Upload validated release backup
        uses: actions/upload-artifact@v4
        with:
          name: v1.5.0-hardened-release
          if-no-files-found: error
          retention-days: 2
          path: |
            index.html
            upload-config.js
            CHANGELOG.md
            package.json
            package-lock.json
            playwright.config.js
            assets/soil-survey-logo.png
            data/organizations.json
            data/results.json
            data/validation-report.json
            src
            scripts/build.mjs
            scripts/check-logo.mjs
            scripts/check-source.mjs
            scripts/validate-data.mjs
            tests
