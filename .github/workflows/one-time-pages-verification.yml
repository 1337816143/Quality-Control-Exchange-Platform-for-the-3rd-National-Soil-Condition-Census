name: One-time Pages verification

on:
  push:
    branches: [admin-import-and-reference-files]
    paths: [pages-verification.trigger]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: one-time-pages-verification
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: verify
        if: steps.deployment.outcome == 'success'
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          result=failed
          http_status=000
          page_title=''
          for attempt in $(seq 1 24); do
            http_status=$(curl -L -sS -o /tmp/pages.html -w '%{http_code}' --max-time 25 "$PAGE_URL" || true)
            page_title=$(python - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/pages.html').read_text(encoding='utf-8', errors='ignore') if Path('/tmp/pages.html').exists() else ''
          match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
          print(re.sub(r'\s+', ' ', match.group(1)).strip() if match else '')
          PY
            )
            if [ "$http_status" = '200' ] && grep -q 'v1.5.0' /tmp/pages.html && grep -q '河北省第三次全国土壤普查成果编制' /tmp/pages.html; then
              result=success
              break
            fi
            sleep 5
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          echo "page_title=$page_title" >> "$GITHUB_OUTPUT"
      - name: Report verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outputs.result }}
          HTTP_STATUS: ${{ steps.verify.outputs.http_status }}
          PAGE_TITLE: ${{ steps.verify.outputs.page_title }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.json
          import json, os
          body = "\n".join([
              "## GitHub Pages 部署验证",
              "",
              f"- 部署步骤：`{os.getenv('DEPLOY_OUTCOME') or 'unknown'}`",
              f"- 公网验证：`{os.getenv('VERIFY_RESULT') or 'not-run'}`",
              f"- HTTP 状态：`{os.getenv('HTTP_STATUS') or 'unknown'}`",
              f"- 页面标题：{os.getenv('PAGE_TITLE') or '未读取'}",
              f"- 页面地址：{os.getenv('PAGE_URL') or '未返回'}",
              f"- 发布提交：`{os.getenv('COMMIT_SHA')}`",
          ])
          print(json.dumps({'body': body}, ensure_ascii=False))
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/12/comments" \
            --data-binary @/tmp/comment.json
      - name: Enforce successful public verification
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outputs.result }}
        run: |
          test "$DEPLOY_OUTCOME" = 'success'
          test "$VERIFY_RESULT" = 'success'
