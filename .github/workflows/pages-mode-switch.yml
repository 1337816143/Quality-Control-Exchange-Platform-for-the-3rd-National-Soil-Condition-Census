name: One-time Pages mode switch

on:
  pull_request:
    branches: [admin-import-and-reference-files]
    paths: [pages-mode-switch.trigger]

permissions:
  contents: read

jobs:
  switch-to-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore and mask existing repository credential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('upload-config.js').read_text(encoding='utf-8')
          match = re.search(r'var codes = \[([^]]+)\]', text)
          if not match:
              raise SystemExit('Token encoding array not found')
          token = ''.join(chr(int(value.strip())) for value in match.group(1).split(','))
          Path('/tmp/pages-admin-token').write_text(token, encoding='utf-8')
          PY
          token=$(cat /tmp/pages-admin-token)
          echo "::add-mask::$token"
      - name: Switch Pages build type to workflow
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/pages-admin-token)
          response=$(mktemp)
          status=$(curl -L -sS -o "$response" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PAGES_UPDATE_HTTP_STATUS=$status"
          if [ -s "$response" ]; then cat "$response"; fi
          test "$status" = '204'
      - name: Verify Pages build type
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/pages-admin-token)
          curl --fail-with-body -L -sS \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages.json
          jq '{status,html_url,build_type,source,public,https_enforced}' /tmp/pages.json
          test "$(jq -r '.build_type' /tmp/pages.json)" = 'workflow'
