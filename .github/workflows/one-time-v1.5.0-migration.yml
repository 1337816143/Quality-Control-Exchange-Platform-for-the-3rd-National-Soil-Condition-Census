name: One-time v1.5.0 migration

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  migrate:
    if: github.event.issue.title == '[automation] Generate v1.5.0' || github.event.pull_request.title == 'feat: v1.5.0 platform upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1.5.0-platform-upgrade
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate transparent PNG logo
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/bootstrap-logo.py

      - name: Generate v1.5.0 structure
        run: node scripts/migrate-v1.5.0.mjs

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Validate data and logo
        run: npm run validate

      - name: Build static site
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run desktop end-to-end tests
        run: npm run test:e2e -- --project=desktop

      - name: Run mobile end-to-end tests
        run: npm run test:e2e -- --project=mobile

      - name: Commit verified v1.5.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release v1.5.0 platform upgrade"
          git push origin HEAD:agent/v1.5.0-platform-upgrade

      - name: Record failure diagnostics
        if: failure()
        run: |
          printf '%s\n' "v1.5.0 migration failed at $(date -u +%FT%TZ). Review the workflow job logs." > migration-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-failure.log
          git commit -m "chore: record v1.5.0 migration failure" || true
          git push origin HEAD:agent/v1.5.0-platform-upgrade || true
